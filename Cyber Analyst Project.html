<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodecForge // Multi-Algorithm Encoder & Decoder</title>
    <style>
        :root {
            --bg-canvas: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-field: #f8fafc;
            --border-subtle: #cbd5e1;
            --border-focus: #4f46e5;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-primary: #4f46e5;
            --accent-secondary: #0d9488;
            --accent-warn: #d97706;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-canvas);
            background-image: radial-gradient(circle at top right, rgba(79, 70, 229, 0.08), transparent 45%),
                              radial-gradient(circle at bottom left, rgba(13, 148, 136, 0.08), transparent 45%);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        .app-shell {
            width: 100%;
            max-width: 720px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            padding-bottom: 20px;
            margin-bottom: 22px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #4338ca;
            background: rgba(79, 70, 229, 0.1);
            border: 1px solid rgba(79, 70, 229, 0.25);
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.25;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 14px;
            align-items: center;
            background-color: var(--bg-field);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 18px;
        }

        .algo-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .algo-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .algo-select {
            flex: 1;
            min-width: 170px;
            background-color: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .algo-select:focus {
            outline: none;
            border-color: var(--border-focus);
        }

        .sample-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .sample-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .chip-btn {
            background-color: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .chip-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            transform: translateY(-1px);
        }

        .field-block {
            margin-bottom: 16px;
        }

        .field-block label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 7px;
        }

        textarea {
            width: 100%;
            height: 112px;
            background-color: var(--bg-field);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
            font-size: 0.93rem;
            line-height: 1.45;
            resize: vertical;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        textarea[readonly] {
            border-style: dashed;
        }

        .action-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(115px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }

        .btn {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid transparent;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:hover {
            filter: brightness(1.06);
        }

        .primary {
            background-color: var(--accent-primary);
            color: #ffffff;
        }

        .success {
            background-color: var(--accent-secondary);
            color: #ffffff;
        }

        .info {
            background-color: #e2e8f0;
            color: var(--text-main);
            border-color: #cbd5e1;
        }

        .secondary {
            background-color: transparent;
            color: var(--text-muted);
            border-color: var(--border-subtle);
        }

        .status {
            min-height: 22px;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .status.ok {
            color: #0f766e;
        }

        .status.error {
            color: var(--danger);
        }

        .security-note {
            margin-top: 20px;
            padding: 14px 16px;
            background-color: rgba(217, 119, 6, 0.08);
            border: 1px solid rgba(217, 119, 6, 0.25);
            border-left: 4px solid var(--accent-warn);
            border-radius: 10px;
            font-size: 0.86rem;
            color: #334155;
        }

        .security-note h3 {
            color: #b45309;
            font-size: 0.94rem;
            margin-bottom: 4px;
        }

        @media (max-width: 640px) {
            .toolbar {
                grid-template-columns: 1fr;
            }

            .app-shell {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="top-bar">
            <div>
                <span class="badge">Data &amp; Cipher Lab</span>
                <h1>Base64 Studio</h1>
                <p class="subtitle">Multi-Algorithm Encoding, Decoding</p>
            </div>
        </header>

        <main>
            <div class="toolbar">
                <div class="algo-group">
                    <label for="algoSelect">Mode:</label>
                    <select id="algoSelect" class="algo-select">
                        <option value="base64">Base64</option>
                        <option value="hex">Hexadecimal (UTF-8)</option>
                        <option value="url">URL Encoding</option>
                        <option value="binary">Binary (8-bit UTF-8)</option>
                        <option value="rot13">ROT13 Cipher</option>
                    </select>
                </div>

                <div class="sample-bar">
                    <span class="sample-label">Samples:</span>
                    <button type="button" id="sampleTextBtn" class="chip-btn">Plain Text</button>
                    <button type="button" id="sampleUtf8Btn" class="chip-btn">UTF-8 / Emoji</button>
                    <button type="button" id="sampleInvalidBtn" class="chip-btn">Invalid</button>
                </div>
            </div>

            <div class="field-block">
                <label for="inputText">Source Payload</label>
                <textarea id="inputText" placeholder="Enter raw text or encoded data here..."></textarea>
            </div>

            <div class="action-row">
                <button type="button" id="encodeBtn" class="btn primary">Encode</button>
                <button type="button" id="decodeBtn" class="btn success">Decode</button>
                <button type="button" id="swapBtn" class="btn info">Swap I/O</button>
                <button type="button" id="copyBtn" class="btn info">Copy Result</button>
                <button type="button" id="clearBtn" class="btn secondary">Reset</button>
            </div>

            <div id="statusMsg" class="status"></div>

            <div class="field-block">
                <label for="outputText">Transformed Output</label>
                <textarea id="outputText" placeholder="Output appears here..." readonly></textarea>
            </div>
        </main>

        <section class="security-note">
            <h3>Security Reminder</h3>
            <p><strong>Encoding &amp; ciphers are not encryption.</strong> None of these modes use a secret key to protect confidentiality—never rely on them to secure passwords or private data.</p>
        </section>
    </div>

    <script>const inputText = document.getElementById("inputText");
const outputText = document.getElementById("outputText");
const statusMsg = document.getElementById("statusMsg");
const algoSelect = document.getElementById("algoSelect");

const textEncoder = new TextEncoder();
const textDecoder = new TextDecoder();

function showStatus(message, isError = false) {
    statusMsg.textContent = message;
    statusMsg.className = isError ? "status error" : "status ok";
}

function bytesToBinaryString(bytes) {
    return Array.from(bytes, (byte) => String.fromCodePoint(byte)).join("");
}

function binaryStringToBytes(binString) {
    return Uint8Array.from(binString, (char) => char.codePointAt(0));
}

function rot13(str) {
    return str.replace(/[a-zA-Z]/g, (char) => {
        const base = char <= "Z" ? 65 : 97;
        return String.fromCharCode(((char.charCodeAt(0) - base + 13) % 26) + base);
    });
}

function encodeByAlgo(raw, algo) {
    switch (algo) {
        case "base64": {
            const bytes = textEncoder.encode(raw);
            return btoa(bytesToBinaryString(bytes));
        }
        case "hex": {
            const bytes = textEncoder.encode(raw);
            return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join(" ");
        }
        case "url": {
            return encodeURIComponent(raw);
        }
        case "binary": {
            const bytes = textEncoder.encode(raw);
            return Array.from(bytes, (b) => b.toString(2).padStart(8, "0")).join(" ");
        }
        case "rot13": {
            return rot13(raw);
        }
        default:
            throw new Error("Unsupported algorithm");
    }
}

function decodeByAlgo(input, algo) {
    switch (algo) {
        case "base64": {
            const binString = atob(input.trim());
            const bytes = binaryStringToBytes(binString);
            return textDecoder.decode(bytes, { fatal: true });
        }
        case "hex": {
            const cleaned = input.trim().replace(/\s+/g, "");
            if (!cleaned || cleaned.length % 2 !== 0 || !/^[0-9a-fA-F]+$/.test(cleaned)) {
                throw new Error("Invalid Hex");
            }
            const bytes = new Uint8Array(cleaned.length / 2);
            for (let i = 0; i < cleaned.length; i += 2) {
                bytes[i / 2] = parseInt(cleaned.slice(i, i + 2), 16);
            }
            return textDecoder.decode(bytes, { fatal: true });
        }
        case "url": {
            return decodeURIComponent(input.trim());
        }
        case "binary": {
            const groups = input.trim().split(/\s+/).filter(Boolean);
            if (groups.length === 0 || !groups.every((bits) => /^[01]{8}$/.test(bits))) {
                throw new Error("Invalid Binary");
            }
            const bytes = Uint8Array.from(groups, (bits) => parseInt(bits, 2));
            return textDecoder.decode(bytes, { fatal: true });
        }
        case "rot13": {
            return rot13(input);
        }
        default:
            throw new Error("Unsupported algorithm");
    }
}

// Encode text using selected algorithm
document.getElementById("encodeBtn").addEventListener("click", () => {
    const raw = inputText.value;
    const algo = algoSelect ? algoSelect.value : "base64";
    const algoLabel = algoSelect ? algoSelect.options[algoSelect.selectedIndex].text : "Base64";

    if (!raw) {
        showStatus("Please enter some text to encode.", true);
        return;
    }
    try {
        outputText.value = encodeByAlgo(raw, algo);
        showStatus(`Successfully encoded using ${algoLabel}!`);
    } catch (err) {
        showStatus(`Error encoding with ${algoLabel}.`, true);
    }
});

// Decode text using selected algorithm
document.getElementById("decodeBtn").addEventListener("click", () => {
    const input = inputText.value;
    const algo = algoSelect ? algoSelect.value : "base64";
    const algoLabel = algoSelect ? algoSelect.options[algoSelect.selectedIndex].text : "Base64";

    if (!input.trim()) {
        showStatus("Please enter text to decode.", true);
        return;
    }
    try {
        outputText.value = decodeByAlgo(input, algo);
        showStatus(`Successfully decoded using ${algoLabel}!`);
    } catch (err) {
        outputText.value = "";
        showStatus(`Invalid input for ${algoLabel}! Check formatting and try again.`, true);
    }
});

// Copy output to clipboard
document.getElementById("copyBtn").addEventListener("click", () => {
    if (!outputText.value) {
        showStatus("Nothing to copy yet.", true);
        return;
    }
    navigator.clipboard.writeText(outputText.value);
    showStatus("Copied output to clipboard!");
});

// Clear all boxes
document.getElementById("clearBtn").addEventListener("click", () => {
    inputText.value = "";
    outputText.value = "";
    statusMsg.textContent = "";
    statusMsg.className = "status";
});

// Swap input and output text
const swapBtn = document.getElementById("swapBtn");
if (swapBtn) {
    swapBtn.addEventListener("click", () => {
        if (!outputText.value) {
            showStatus("Nothing in output to swap.", true);
            return;
        }
        const temp = inputText.value;
        inputText.value = outputText.value;
        outputText.value = temp;
        showStatus("Swapped input and output!");
    });
}

// Helper to load sample text into input
function loadSample(text, label) {
    inputText.value = text;
    outputText.value = "";
    showStatus(`Loaded sample: ${label}`);
}

const sampleTextBtn = document.getElementById("sampleTextBtn");
if (sampleTextBtn) {
    sampleTextBtn.addEventListener("click", () => {
        loadSample("Base64 makes text transport safe.", "Plain Text");
    });
}

const sampleUtf8Btn = document.getElementById("sampleUtf8Btn");
if (sampleUtf8Btn) {
    sampleUtf8Btn.addEventListener("click", () => {
        loadSample("Namaste! 🙌", "UTF-8 / Emoji");
    });
}

const sampleInvalidBtn = document.getElementById("sampleInvalidBtn");
if (sampleInvalidBtn) {
    sampleInvalidBtn.addEventListener("click", () => {
        loadSample("Not_Valid_Base64!!!", "Invalid Base64");
    });
}
</script>
</body>
</html>
